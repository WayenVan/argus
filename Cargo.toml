[workspace]
resolver = "3"
members = ["crates/argus-proto", "crates/argus-holder", "crates/argus-hook", "crates/argus"]
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
argus-proto = { path = "crates/argus-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
memchr = "2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "poll", "resource", "user"] }
signal-hook = "0.3.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync", "signal", "process"] }
vte = "0.15"

# vt100 0.16.2 with a fix for a panic after a row is shortened through a wide
# character (see vendor/vt100/PATCHES.md). Drop once upstream ships the fix.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
