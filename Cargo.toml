[workspace]
resolver = "3"
members = ["crates/argus-proto", "crates/argus-holder", "crates/argus-hook", "crates/argus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
argus-proto = { path = "crates/argus-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync", "signal", "process"] }
